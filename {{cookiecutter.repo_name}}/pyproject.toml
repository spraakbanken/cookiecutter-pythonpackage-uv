[project]
name = "{{ cookiecutter.project_name }}"
version = "{{ cookiecutter.version }}"
description = "{{ cookiecutter.description }}"
readme = "README.md"
requires-python = "{{ cookiecutter.requires_python }}"
authors = [{ name = "{{ cookiecutter.author }}", email = "{{ cookiecutter.email }}" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  # "Development Status :: 4 - Beta",
  # "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX",
  "Operating System :: Unix",
  {% if cookiecutter.min_python_version <= "3.11" -%}"Programming Language :: Python :: 3.11",{%- endif %}
  {% if cookiecutter.min_python_version <= "3.12" -%}"Programming Language :: Python :: 3.12",{%- endif %}
  {% if cookiecutter.min_python_version <= "3.13" -%}"Programming Language :: Python :: 3.13",{%- endif %}
  {% if cookiecutter.min_python_version <= "3.14" -%}"Programming Language :: Python :: 3.14",{%- endif %}
  {% if cookiecutter.min_python_version <= "3.15" -%}"Programming Language :: Python :: 3.15",{%- endif %}
  "Programming Language :: Python :: Implementation :: CPython",
  # "uncomment if you test on these interpreters:",
  # "Programming Language :: Python :: Implementation :: IronPython",
  # "Programming Language :: Python :: Implementation :: Jython",
  # "Programming Language :: Python :: Implementation :: Stackless",
  "Topic :: Utilities",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Changelog = "https://github.com/{{ cookiecutter.github_handle }}/{{ cookiecutter.repo_name }}/blob/main/CHANGELOG.md"
Homepage = "https://spraakbanken.se"
Issues = "https://github.com/{{ cookiecutter.github_handle }}/{{ cookiecutter.repo_name }}/issues"
Repository = "https://github.com/{{ cookiecutter.github_handle }}/{{ cookiecutter.repo_name }}"

[dependency-groups]
dev = [
  { include-group = "lint" },
  { include-group = "test" },
]
lint = [
  "ruff>=0.16.9",
  "ty>=0.0.84",
]
test = [
  "pytest>=8.4.0",
  "pytest-cov>=7.0.0",
  {%- if cookiecutter.add_syrupy -%}"syrupy>=6.0.0",{% endif %}
]

[build-system]
requires = ["uv_build>=0.12.0,<0.14.0"]
build-backend = "uv_build"
